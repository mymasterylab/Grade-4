<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Summit of Mastery · Cable Car homework</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#1d1d1f;--muted:#5b6467;--surface:#fff;--line:#d9eef0;--pri:#00A7B2;--pri-dark:#00818a;--pri-soft:#e3f6f7;--acc:#FAA71C;--acc-soft:#fff1d6;--burnt:#D77F28;
--ok:#047857;--ok-soft:#e1f4ec;--bad:#C92426;--bad-soft:#fde8e8;--fd:'Russo One','Trebuchet MS',system-ui,sans-serif;--fb:'Lexend',system-ui,sans-serif}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.45}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* Engine components. Theme supplies: --ink --muted --surface --line --pri --pri-soft --acc --acc-soft --ok --ok-soft --bad --bad-soft --fd --fb */
.q-card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 18px 14px;margin:0 0 16px;position:relative}
.q-card.is-right{border-color:var(--ok)}
.q-card.is-wrong{border-color:var(--bad)}
.q-card.is-shown{border-color:var(--acc)}
.q-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.q-num{font-family:var(--fd);font-size:1rem;background:var(--pri);color:#fff;border-radius:10px;min-width:2em;height:2em;display:inline-grid;place-items:center;padding:0 .4em}
.q-type{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.q-prompt{font-size:1.08rem;line-height:1.5;margin-bottom:12px;color:var(--ink)}
.q-visual{margin:4px 0 12px}
.q-chip{display:inline-block;background:var(--pri-soft);border-radius:8px;padding:0 .4em;font-weight:600}
.q-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.q-options.many{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.q-options.wide{grid-template-columns:1fr}
.q-opt{font:inherit;font-size:1.02rem;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink);transition:transform .12s,border-color .12s,background .12s}
.q-options.many .q-opt{text-align:center;font-family:var(--fd);font-size:1.25rem;padding:10px 6px}
.q-opt:hover{border-color:var(--pri);transform:translateY(-1px)}
.q-opt.on{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 0 0 3px var(--pri-soft)}
.q-opt.good{border-color:var(--ok);background:var(--ok-soft)}
.q-opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.q-opt.missed{border-style:dashed;border-color:var(--ok)}
.locked .q-opt{cursor:default;transform:none}
.q-fill{font-size:1.15rem;line-height:2.4;color:var(--ink)}
.q-blank{font:inherit;font-family:var(--fd);font-size:1.2rem;text-align:center;border:none;border-bottom:3px solid var(--pri);background:var(--pri-soft);border-radius:10px 10px 4px 4px;padding:2px 6px;margin:0 4px;color:var(--ink);outline:none;min-width:2.2em}
.q-blank:focus{box-shadow:0 0 0 3px var(--acc-soft);border-bottom-color:var(--acc)}
.q-blank.good{border-bottom-color:var(--ok);background:var(--ok-soft)}
.q-blank.bad{border-bottom-color:var(--bad);background:var(--bad-soft)}
.q-sort{display:flex;flex-direction:column;gap:12px}
.q-tray{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:14px;background:#fff;align-items:center}
.q-sort.tray-empty .q-tray{min-height:24px;padding:4px}
.q-bins{display:grid;gap:10px}
.q-bins.n2{grid-template-columns:1fr 1fr}.q-bins.n3{grid-template-columns:repeat(3,1fr)}.q-bins.n4{grid-template-columns:repeat(2,1fr)}
.q-bin{border:2px solid var(--line);border-radius:14px;background:var(--pri-soft);min-height:110px;padding:8px;transition:background .15s,border-color .15s}
.q-bin:nth-child(2){background:var(--acc-soft)}.q-bin:nth-child(3){background:#f1f3f4}
.q-bin.hover,.q-tray.hover{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.q-bin-title{font-family:var(--fd);font-size:1rem;margin-bottom:6px;color:var(--ink)}
.q-bin-body{display:flex;flex-wrap:wrap;gap:6px;min-height:50px}
.q-dchip{font:inherit;font-family:var(--fd);font-size:1.15rem;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 12px;cursor:grab;touch-action:none;user-select:none;color:var(--ink)}
.q-dchip.picked{background:var(--acc);border-color:var(--acc);color:#fff;transform:scale(1.06)}
.q-dchip.dragging{opacity:.3}
.q-dchip.good{border-color:var(--ok);background:var(--ok-soft)}
.q-dchip.bad{border-color:var(--bad);background:var(--bad-soft)}
.q-ghost{position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%) rotate(-4deg) scale(1.08);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.locked .q-dchip{cursor:default}
.q-match{display:grid;grid-template-columns:1fr 24px 1fr;gap:8px;align-items:start}
.q-mcol{display:flex;flex-direction:column;gap:8px}
.q-mitem{font:inherit;font-size:1.02rem;background:#fff;border:2px solid var(--line);border-left:8px solid var(--pc,transparent);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;position:relative;color:var(--ink)}
.q-mitem.r{border-left-width:2px;border-right:8px solid var(--pc,transparent)}
.q-mitem.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.q-mitem.paired::after{content:attr(data-tag);position:absolute;top:-8px;right:-8px;background:var(--pc);color:#fff;font-family:var(--fd);font-size:.8rem;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.q-mitem.r.paired::after{right:auto;left:-8px}
.q-mitem.good{background:var(--ok-soft)}.q-mitem.bad{background:var(--bad-soft)}
.q-mmid{align-self:stretch;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px);width:3px;margin:auto}
.q-actions{display:flex;gap:10px;margin-top:14px}
.q-check,.q-show{font:inherit;font-family:var(--fd);font-size:1.05rem;border:none;border-radius:14px;padding:10px 22px;cursor:pointer}
.q-check{background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-dark,#00818a)}
.q-check:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-dark,#00818a)}
.q-show{background:#fff;border:2px solid var(--acc);color:var(--ink)}
.q-fb{min-height:1.4em;margin-top:10px;font-size:1rem;line-height:1.45}
.q-fb .ok{color:var(--ok);font-weight:700}.q-fb .bad{color:var(--bad);font-weight:600}.q-fb .info{color:var(--ink)}
.q-fb .why{color:var(--ink);font-weight:400;margin-top:4px;font-size:.95rem}
.q-peek{font:inherit;font-size:.9rem;background:none;border:none;color:var(--pri);text-decoration:underline;cursor:pointer}
.shake{animation:qshake .4s}
@keyframes qshake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.s-panel{margin-top:14px}
.s-row{display:flex;flex-wrap:wrap;gap:10px}
.s-btn{font:inherit;font-family:var(--fd);font-size:1rem;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--pri);border-radius:12px;padding:9px 16px;cursor:pointer}
.s-btn.s-main{background:var(--pri);color:#fff}
.s-status{min-height:1.3em;margin-top:8px;color:var(--ok);font-weight:600}
@media (max-width:620px){.q-options{grid-template-columns:1fr}.q-options.many{grid-template-columns:repeat(4,1fr)}.q-bins.n3{grid-template-columns:1fr}.q-match{grid-template-columns:1fr 10px 1fr}.q-mitem{font-size:.92rem;padding:8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.chr{display:block;overflow:visible}
.chr .bob{animation:bob 3s ease-in-out infinite}
.chr .breathe{animation:br 4s ease-in-out infinite;transform-origin:70px 146px}
.chr .hop{animation:hop 1.8s ease-in-out infinite}
.chr .blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
.chr .qm{animation:qm 1.4s ease-in-out infinite}
.chr .pole{animation:pole 2s ease-in-out infinite;transform-box:fill-box;transform-origin:left top}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes br{50%{transform:scale(1.02)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes qm{50%{transform:translateY(-6px);opacity:.6}}
@keyframes pole{50%{transform:rotate(-6deg)}}
.chr.talk .bob,.chr.talk .hop{animation-duration:.8s}

.top{max-width:1060px;margin:0 auto;padding:22px 20px 0}
.titlerow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--fd);font-weight:400;font-size:clamp(2rem,5vw,3.2rem);margin:0;line-height:1}
h1 span{display:block;font-size:.42em;color:var(--burnt);margin-top:6px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls input{font:inherit;border:2px solid var(--pri);border-radius:12px;padding:9px 12px;min-width:200px}
.btn{font-family:var(--fd);font-size:1.05rem;border-radius:14px;padding:9px 18px;cursor:pointer;border:2px solid var(--pri);background:#fff;color:var(--ink)}
.btn.main{background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-dark)}
.btn.gold{background:var(--acc);border-color:var(--acc);box-shadow:0 4px 0 var(--burnt)}
.rail{position:relative;margin:18px 0 8px;height:176px;border-radius:22px;background:linear-gradient(180deg,#d6f4f6,#fff 70%);border:3px solid var(--line);overflow:hidden}
.rail svg.bg{position:absolute;inset:0;width:100%;height:100%}
.stations{position:absolute;left:6%;right:6%;bottom:10px;display:flex;justify-content:space-between}
.st{font:inherit;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:20%;color:var(--ink);padding:0}
.st .post{width:40px;height:40px;border-radius:12px;background:#fff;border:3px solid var(--burnt);font-family:var(--fd);font-size:1.3rem;display:grid;place-items:center;position:relative}
.st small{font-size:.75rem;color:var(--ink);text-align:center;line-height:1.1;background:#fff;border-radius:8px;padding:1px 6px;margin-top:4px}
.st.on .post{background:var(--acc);border-color:var(--burnt);transform:scale(1.12)}
.st.done .post{background:var(--ok);color:#fff;border-color:var(--ok)}
.st .sc{position:absolute;top:-12px;right:-22px;background:#fff;border:2px solid var(--ok);border-radius:8px;font-size:.7rem;padding:0 5px;font-family:var(--fd);color:var(--ok)}
.cart{position:absolute;bottom:60px;left:6%;width:120px;transition:left 1s cubic-bezier(.5,0,.3,1);transform:translateX(-30%)}
.cart .bounce{animation:cartbob .5s ease-in-out infinite alternate}
@keyframes cartbob{to{transform:translateY(-3px)}}
.cart.moving .bounce{animation-duration:.15s}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px 60px}
.stationhead{display:flex;align-items:center;gap:14px;margin:14px 0 14px;flex-wrap:wrap}
.stationhead .badge{font-family:var(--fd);font-size:1.8rem;width:60px;height:60px;border-radius:16px;background:var(--burnt);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 #a85d17}
.stationhead h2{font-family:var(--fd);font-weight:400;font-size:1.7rem;margin:0;line-height:1.05}
.stationhead p{margin:2px 0 0;color:var(--muted)}
.foot2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:4px}
.warn{color:var(--bad);font-weight:600}
.ticket{border:3px dashed var(--burnt);border-radius:22px;padding:22px;background:var(--acc-soft);display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ticket .big{font-family:var(--fd);font-size:3.2rem;line-height:1;text-align:center;background:#fff;border-radius:18px;padding:14px 18px;border:3px solid var(--burnt)}
.ticket .big small{display:block;font-size:1rem;color:var(--muted)}
.ticket h2{font-family:var(--fd);font-weight:400;margin:0 0 6px;font-size:1.8rem}
.rows{display:grid;gap:6px;margin:8px 0}
.rows div{display:grid;grid-template-columns:1fr 70px 110px;gap:10px;align-items:center}
.rbar{height:12px;border-radius:999px;background:#fff;overflow:hidden}.rbar i{display:block;height:100%;background:var(--pri)}
.note{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 12px;margin-bottom:16px}
.note .face{width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--pri-soft);flex:none;display:grid;place-items:center}
.note .face svg{width:46px;margin-top:8px}.note .who{font-family:var(--fd);font-weight:400;color:var(--burnt)}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin:20px 0}
@media (max-width:700px){.st small{display:none}.cart{width:80px;bottom:62px}.ticket{grid-template-columns:1fr}.rows div{grid-template-columns:1fr 60px}.rows .rbar{grid-column:1/-1}}
:root{--pri:#047857;--pri-dark:#035a41;--pri-soft:#e1f4ec;--acc:#C92426;--acc-soft:#fde8e8;--burnt:#00A7B2;--line:#d3ebdc;--fd:'Russo One','Trebuchet MS',system-ui,sans-serif}.note .who,.who{font-family:var(--fd);font-weight:400;color:var(--burnt)}

h1{color:var(--pri)}h1 span{color:var(--acc)}
.rail{border-color:var(--pri);background:#e9f8f9}
.st .post{border-color:var(--pri)}.st.on .post{background:var(--acc);color:#fff;border-color:var(--acc)}
.cart{bottom:48px}
.stationhead .badge{background:var(--pri);box-shadow:0 5px 0 var(--pri-dark)}
.btn.main{background:var(--pri);border-color:var(--pri);box-shadow:0 4px 0 var(--pri-dark)}.btn.gold{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 0 #8f1a1b}
.ticket{border-color:var(--pri);background:var(--pri-soft)}

</style>

<body>
<div class="top">
 <div class="titlerow"><h1>Cable Car Climb<span>Summit of Mastery homework</span></h1>
  <div class="controls"><input id="nm" placeholder="Your name" autocomplete="off" aria-label="Your name"><button class="btn" type="button" id="newSet">New set of questions</button></div></div>
 <div class="rail" id="rail">
  <svg class="bg" viewBox="0 0 1000 150" preserveAspectRatio="none"><rect width="1000" height="150" fill="#e9f8f9"/><path d="M0 100 L160 30 L320 96 L520 20 L700 90 L860 40 L1000 90 V150 H0Z" fill="#9fd08a"/><path d="M500 28 L520 20 L540 30Z" fill="#fff"/><rect x="0" y="96" width="1000" height="5" fill="#047857"/><rect x="0" y="101" width="1000" height="49" fill="#cfe9b8"/></svg>
  <div class="cart" id="cart"><div class="bounce"><svg viewBox="0 0 130 100"><g transform="translate(65 50)"><path d="M-30 0 Q0 -40 30 0" fill="none" stroke="#1d1d1f" stroke-width="3"/><rect x="-24" y="0" width="48" height="34" rx="8" fill="#C92426"/><rect x="-16" y="6" width="32" height="14" rx="4" fill="#d6f4f6"/><circle cx="0" cy="-20" r="5" fill="#1d1d1f"/></g></svg></div></div>
  <div class="stations" id="stations"></div>
 </div>
</div>
<main class="wrap" id="main"></main>
<p class="foot">MyMasteryLab · Summit of Mastery</p>
<script>/* MML Unit 4 question engine: mcq, multi, fill, sort (drag & drop), match.
   Modes: "practice" (check + hints + retry), "test" (graded on submit), "diagnostic" (no feedback). */
const MML = (() => {
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  };
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = (a, n) => shuffle(a).slice(0, n);
  const rint = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

  const norm = (s) => {
    let t = String(s ?? '').trim().toLowerCase();
    t = t.replace(/[✗✘×]/g, (m) => (m === '×' ? 'x' : 'x'));
    if (['-', '—', 'no', 'none', 'n', 'not', 'nope'].includes(t)) t = 'x';
    return t.replace(/[\s,]/g, '');
  };
  const sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));

  /* Rich text: **bold**, `chip` and line breaks */
  const rich = (s) => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`(.+?)`/g, '<span class="q-chip">$1</span>')
    .replace(/\n/g, '<br>');

  /* ---------- individual question widgets ---------- */
  function mcq(q, multi) {
    const order = q.keepOrder ? q.options.map((_, i) => i) : shuffle(q.options.map((_, i) => i));
    const sel = new Set();
    const box = h('div', { class: 'q-options' + (q.options.length > 4 && q.options.every((o) => String(o).length <= 5) ? ' many' : '') + (q.wide ? ' wide' : '') });
    const btns = {};
    order.forEach((i) => {
      const b = h('button', { class: 'q-opt', type: 'button', html: rich(q.options[i]),
        onclick: () => {
          if (box.classList.contains('locked')) return;
          if (multi) { sel.has(i) ? sel.delete(i) : sel.add(i); }
          else { sel.clear(); sel.add(i); }
          Object.entries(btns).forEach(([k, el]) => el.classList.toggle('on', sel.has(+k)));
          api.onChange && api.onChange();
        } });
      btns[i] = b; box.append(b);
    });
    const ans = multi ? q.answer : [q.answer];
    const api = {
      el: box,
      answered: () => sel.size > 0,
      check() {
        const picked = [...sel];
        if (!multi) return picked[0] === q.answer ? 1 : 0;
        const right = picked.filter((x) => ans.includes(x)).length;
        const wrong = picked.length - right;
        return Math.max(0, (right - wrong) / ans.length);
      },
      mark() { Object.entries(btns).forEach(([k, el]) => {
        const isAns = ans.includes(+k), on = sel.has(+k);
        el.classList.toggle('good', isAns && on); el.classList.toggle('bad', !isAns && on); el.classList.toggle('missed', isAns && !on);
      }); },
      clearMarks() { Object.values(btns).forEach((el) => el.classList.remove('good', 'bad', 'missed')); },
      reveal() { sel.clear(); ans.forEach((a) => sel.add(a)); Object.entries(btns).forEach(([k, el]) => el.classList.toggle('on', sel.has(+k))); api.mark(); },
      lock() { box.classList.add('locked'); },
      value: () => [...sel].map((i) => q.options[i]).join(', '),
    };
    return api;
  }

  function fill(q) {
    const wrap = h('div', { class: 'q-fill' });
    const inputs = [];
    const parts = String(q.text).split('[]');
    const answers = q.answers.map((a) => (Array.isArray(a) ? a : [a]).map(norm));
    parts.forEach((p, i) => {
      if (p) wrap.append(h('span', { html: rich(p) }));
      if (i < parts.length - 1) {
        const accept = answers[i] || [''];
        const numeric = accept.every((a) => /^\d+$/.test(a) || a === 'x');
        const w = Math.max(2.4, Math.max(...accept.map((a) => a.length)) * 0.75 + 1.4);
        const inp = h('input', { class: 'q-blank', type: 'text', autocomplete: 'off', spellcheck: 'false',
          inputmode: numeric && !accept.includes('x') ? 'numeric' : 'text', 'aria-label': 'answer ' + (i + 1),
          style: `width:${q.width || w}em`, oninput: () => { inp.classList.remove('good', 'bad'); api.onChange && api.onChange(); } });
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const nx = inputs[inputs.indexOf(inp) + 1]; nx ? nx.focus() : api.onEnter && api.onEnter(); } });
        inputs.push(inp); wrap.append(inp);
      }
    });
    const ok = (i) => answers[i].includes(norm(inputs[i].value));
    const api = {
      el: wrap,
      answered: () => inputs.every((x) => x.value.trim() !== ''),
      check() { if (q.anyOrder) { const vals = inputs.map((x) => norm(x.value)); const pool = answers.map((a) => a[0]); let n = 0; const used = []; vals.forEach((v) => { const k = pool.findIndex((p, j) => p === v && !used.includes(j)); if (k > -1) { used.push(k); n++; } }); return n / inputs.length; }
        return inputs.filter((_, i) => ok(i)).length / inputs.length; },

        inputs.forEach((x, i) => { x.classList.toggle('good', ok(i)); x.classList.toggle('bad', !ok(i)); }); },

      reveal() { inputs.forEach((x, i) => { const raw = (Array.isArray(q.answers[i]) ? q.answers[i][0] : q.answers[i]); x.value = raw === 'x' ? '✗' : raw; }); api.mark(); },

  /* Drag & drop sort with pointer drag + tap-to-place */
  let dragSel = null;
  function sort(q) {

    const bins = q.bins.map((b, i) => h('div', { class: 'q-bin', 'data-bin': i }, h('div', { class: 'q-bin-title', html: rich(b) }), h('div', { class: 'q-bin-body' })));
    const chips = shuffle(q.items.map((it, i) => ({ ...it, i }))).map((it) => {
      const c = h('button', { class: 'q-dchip', type: 'button', 'data-i': it.i, html: rich(it.label) });

    chips.forEach((c) => {

/* ---------- number helpers for generators ---------- */
const NT = {

<script>/* Test kit: builds graded sections, keeps scores, writes the share summary. */
const TK = (() => {
  const { h, card } = MML;
  function Section(def, idx) {
    const s = { def, idx, cards: [], graded: false, score: 0, total: def.questions.length };
    s.render = (mount) => {
      mount.innerHTML = '';
      if (!s.cards.length) s.cards = def.questions.map((q, k) => card(q, { mode: 'test', num: def.key + (k + 1) }));
      s.cards.forEach((c) => mount.append(c.el));
    };
    s.unanswered = () => s.cards.filter((c) => !c.answered()).length;
    s.grade = () => {
      s.score = 0;
      s.cards.forEach((c) => { const v = c.grade(); if (v >= 0.999) s.score++; c.showResult(); });
      s.graded = true; return s.score;
    };
    s.answers = () => s.cards.map((c, k) => def.key + (k + 1) + ' ' + (c.state.score >= 0.999 ? '✓' : '✗'));
    return s;
  }
  function summary({ title, name, sections, ms, extra }) {
    const done = sections.filter((s) => s.graded);
    const sc = done.reduce((a, s) => a + s.score, 0), tot = sections.reduce((a, s) => a + s.total, 0);
    const pct = tot ? Math.round((sc / tot) * 100) : 0;
    const lines = [
      'MyMasteryLab · ' + title,
      'Learner: ' + name,
      'Date: ' + new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }),
      'Score: ' + sc + ' / ' + tot + ' (' + pct + '%)',
      'Time: ' + MML.fmtTime(ms),
      '',
      ...sections.map((s) => s.def.key + '. ' + s.def.title + ': ' + (s.graded ? s.score + '/' + s.total : 'not checked')),
      '',
      'Question by question: ' + done.flatMap((s) => s.answers()).join(', '),
    ];
    if (extra) lines.push('', extra);
    return { text: lines.join('\n'), sc, tot, pct };
  }
  return { Section, summary };
})();

<script>/* seeded random + drawing from generator pools */
const KIT = (() => {
  function withSeed(seed, fn) { const orig = Math.random; let a = seed; Math.random = function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; try { return fn(); } finally { Math.random = orig; } }
  function uniq(gens, n = 20) {
    const out = [], seen = new Set(); let guard = 0;
    while (out.length < n && guard++ < 800) {
      const g = (out.length + guard) % gens.length; const q = gens[g](); q._g = g;
      const key = q.prompt + '|' + (q.text || '') + '|' + (q.options || q.items || q.left || []).map((x) => x.label ?? x).join(',');
      if (!seen.has(key)) { seen.add(key); out.push(q); }
    }
    return out;
  }
  function draw(pool, n) {
    const sh = MML.shuffle(pool), out = [], seen = new Set();
    sh.forEach((q) => { if (out.length < n && !seen.has(q._g)) { seen.add(q._g); out.push(q); } });
    sh.forEach((q) => { if (out.length < n && !out.includes(q)) out.push(q); });
    return out.sort((a, b) => a._g - b._g);
  }
  const pick1 = (a) => a[Math.floor(Math.random() * a.length)];
  return { withSeed, uniq, draw, pick1 };
})();

      () => { const d = P([2, 4]), q = rint(2, 9); return { type: 'fill', prompt: `**${d * q + 1}** pizzas shared by **${d}** friends. (Write like 2 1/2.)`, text: '[] pizzas each', answers: [d === 2 ? [`${q} 1/2`, `${q}½`, `${q}.5`] : [`${q} 1/4`, `${q}¼`, `${q}.25`]] }; },

  function D() {

      () => { const d = rint(4, 9), q = rint(8, 20), r = rint(1, d - 1); const n = d * q + r; return { type: 'mcq', prompt: `**${n} riders, ${d} per car → ${q + 1} cars.** Which reason defends this?`, options: [`${n} ÷ ${d} = ${q} R ${r}; the ${r} riders still need a car`, 'Always add 1', `${n} ÷ ${d} is about ${q + 1}`, 'Remainders are always rounded up'], answer: 0 }; },
      () => { const d = rint(4, 9), q = rint(10, 40), r = rint(1, d - 1); const n = d * q + r; return { type: 'mcq', prompt: `**${n} kg, ${d} kg per bed → ${q} full beds.** Which reason defends this?`, options: [`${n} ÷ ${d} = ${q} R ${r}; ${r} kg cannot fill a whole bed`, `${q} is the closest number`, `Because ${d} × ${q} = ${n}`, 'Always round down'], answer: 0 }; },

      () => { const S = shuffle([['Cars for all the riders', 0], ['Full boxes only', 1], ['How many are left over', 2], ['Pizza each person gets', 3]]); return { type: 'match', prompt: 'Match each story to what you do with the remainder.', left: S.map((s) => s[0]), right: ['Round up', 'Drop it', 'The remainder is the answer', 'Share it as a fraction'], answer: S.map((s) => s[1]) }; },
    ]);

      () => { const d = rint(3, 9), q = rint(20, 99); const N = d * q; return { type: 'fill', prompt: 'Split it mentally.', text: `${N} ÷ ${d} = []`, answers: [String(q)] }; },
    ]);
  }
  const SECTIONS = [
    { key: 'A', title: 'Fluency', short: 'Fluency', station: 'Base Camp', who: 'ama', say: 'Quick, accurate division. Accuracy beats speed.', make: A },
    { key: 'B', title: 'Concepts', short: 'Concepts', station: 'Ice Bridge', who: 'yogi', say: 'Show you understand why each method works.', make: B },
    { key: 'C', title: 'Problem Solving', short: 'Problems', station: 'Ridge Camp', who: 'ama', say: 'Real problems: plan, divide, decide.', make: C },
    { key: 'D', title: 'Defend It', short: 'Defend', station: 'Echo Cliffs', who: 'echo', say: 'Pick the answer AND the reason. How do you know?', make: D },
    { key: 'E', title: 'Mixed Mastery', short: 'Mixed', station: 'The Summit', who: 'yogi', say: 'Everything from Unit 4, all mixed together.', make: E },
  ];
  return { SECTIONS };
})();

function newSet() {
