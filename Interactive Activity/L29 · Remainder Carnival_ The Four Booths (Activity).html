.q-actions{display:flex;gap:10px;margin-top:14px}
.q-check,.q-show{font:inherit;font-family:var(--fd);font-size:1.05rem;border:none;border-radius:14px;padding:10px 22px;cursor:pointer}
.q-check{background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-dark,#00818a)}

<script>/* MML Unit 4 question engine: mcq, multi, fill, sort (drag & drop), match.
   Modes: "practice" (check + hints + retry), "test" (graded on submit), "diagnostic" (no feedback). */
const MML = (() => {
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  };
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = (a, n) => shuffle(a).slice(0, n);
  const rint = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

  const norm = (s) => {
    let t = String(s ?? '').trim().toLowerCase();
    t = t.replace(/[✗✘×]/g, (m) => (m === '×' ? 'x' : 'x'));
    if (['-', '—', 'no', 'none', 'n', 'not', 'nope'].includes(t)) t = 'x';
    return t.replace(/[\s,]/g, '');
  };
  const sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));

  /* Rich text: **bold**, `chip` and line breaks */
  const rich = (s) => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`(.+?)`/g, '<span class="q-chip">$1</span>')
    .replace(/\n/g, '<br>');

  /* ---------- individual question widgets ---------- */
  function mcq(q, multi) {
    const order = q.keepOrder ? q.options.map((_, i) => i) : shuffle(q.options.map((_, i) => i));
    const sel = new Set();
    const box = h('div', { class: 'q-options' + (q.options.length > 4 && q.options.every((o) => String(o).length <= 5) ? ' many' : '') + (q.wide ? ' wide' : '') });
    const btns = {};
    order.forEach((i) => {
      const b = h('button', { class: 'q-opt', type: 'button', html: rich(q.options[i]),
        onclick: () => {
          if (box.classList.contains('locked')) return;
          if (multi) { sel.has(i) ? sel.delete(i) : sel.add(i); }
          else { sel.clear(); sel.add(i); }
          Object.entries(btns).forEach(([k, el]) => el.classList.toggle('on', sel.has(+k)));
          api.onChange && api.onChange();
        } });
      btns[i] = b; box.append(b);
    });
    const ans = multi ? q.answer : [q.answer];
    const api = {
      el: box,
      answered: () => sel.size > 0,
      check() {
        const picked = [...sel];
        if (!multi) return picked[0] === q.answer ? 1 : 0;
        const right = picked.filter((x) => ans.includes(x)).length;
        const wrong = picked.length - right;
        return Math.max(0, (right - wrong) / ans.length);
      },
      mark() { Object.entries(btns).forEach(([k, el]) => {
        const isAns = ans.includes(+k), on = sel.has(+k);
        el.classList.toggle('good', isAns && on); el.classList.toggle('bad', !isAns && on); el.classList.toggle('missed', isAns && !on);
      }); },
      clearMarks() { Object.values(btns).forEach((el) => el.classList.remove('good', 'bad', 'missed')); },
      reveal() { sel.clear(); ans.forEach((a) => sel.add(a)); Object.entries(btns).forEach(([k, el]) => el.classList.toggle('on', sel.has(+k))); api.mark(); },
      lock() { box.classList.add('locked'); },
      value: () => [...sel].map((i) => q.options[i]).join(', '),
    };
    return api;
  }

  function fill(q) {
    const wrap = h('div', { class: 'q-fill' });
    const inputs = [];
    const parts = String(q.text).split('[]');
    const answers = q.answers.map((a) => (Array.isArray(a) ? a : [a]).map(norm));
    parts.forEach((p, i) => {
      if (p) wrap.append(h('span', { html: rich(p) }));
      if (i < parts.length - 1) {
        const accept = answers[i] || [''];
        const numeric = accept.every((a) => /^\d+$/.test(a) || a === 'x');
        const w = Math.max(2.4, Math.max(...accept.map((a) => a.length)) * 0.75 + 1.4);
        const inp = h('input', { class: 'q-blank', type: 'text', autocomplete: 'off', spellcheck: 'false',
          inputmode: numeric && !accept.includes('x') ? 'numeric' : 'text', 'aria-label': 'answer ' + (i + 1),
          style: `width:${q.width || w}em`, oninput: () => { inp.classList.remove('good', 'bad'); api.onChange && api.onChange(); } });
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const nx = inputs[inputs.indexOf(inp) + 1]; nx ? nx.focus() : api.onEnter && api.onEnter(); } });
        inputs.push(inp); wrap.append(inp);
      }
    });
    const ok = (i) => answers[i].includes(norm(inputs[i].value));
    const api = {
      el: wrap,
      answered: () => inputs.every((x) => x.value.trim() !== ''),
      check() { if (q.anyOrder) { const vals = inputs.map((x) => norm(x.value)); const pool = answers.map((a) => a[0]); let n = 0; const used = []; vals.forEach((v) => { const k = pool.findIndex((p, j) => p === v && !used.includes(j)); if (k > -1) { used.push(k); n++; } }); return n / inputs.length; }
        return inputs.filter((_, i) => ok(i)).length / inputs.length; },
      mark() { if (q.anyOrder) { const pool = answers.map((a) => a[0]); const used = []; inputs.forEach((x) => { const k = pool.findIndex((p, j) => p === norm(x.value) && !used.includes(j)); if (k > -1) used.push(k); x.classList.toggle('good', k > -1); x.classList.toggle('bad', k < 0); }); return; }
        inputs.forEach((x, i) => { x.classList.toggle('good', ok(i)); x.classList.toggle('bad', !ok(i)); }); },
      clearMarks() { inputs.forEach((x) => x.classList.remove('good', 'bad')); },
      reveal() { inputs.forEach((x, i) => { const raw = (Array.isArray(q.answers[i]) ? q.answers[i][0] : q.answers[i]); x.value = raw === 'x' ? '✗' : raw; }); api.mark(); },
      lock() { inputs.forEach((x) => (x.readOnly = true)); },
      focus() { inputs[0] && inputs[0].focus(); },
      value: () => inputs.map((x) => x.value.trim() || '·').join(' | '),
    };
    return api;
  }

  /* Drag & drop sort with pointer drag + tap-to-place */
  let dragSel = null;
  function sort(q) {
    const wrap = h('div', { class: 'q-sort' });
    const tray = h('div', { class: 'q-tray', 'data-bin': '-1' });
    const bins = q.bins.map((b, i) => h('div', { class: 'q-bin', 'data-bin': i }, h('div', { class: 'q-bin-title', html: rich(b) }), h('div', { class: 'q-bin-body' })));
    const chips = shuffle(q.items.map((it, i) => ({ ...it, i }))).map((it) => {
      const c = h('button', { class: 'q-dchip', type: 'button', 'data-i': it.i, html: rich(it.label) });
      c._bin = -1; return c;
    });
    chips.forEach((c) => tray.append(c));

  document.querySelectorAll('.spot').forEach((g) => { g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button'); g.addEventListener('click', () => openMission(+g.dataset.m)); g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openMission(+g.dataset.m); } }); });
  const home = () => { document.body.classList.remove('in-mission'); refreshHub(); };
  $('#backBtn').onclick = home; $('#goHome').onclick = home;
  $('#nextBtn').onclick = () => { if (S.cur === L.missions.length - 1) { home(); if (S.lit.size === L.missions.length) party(); return; } openMission(S.cur + 1); };
  $('#partyClose').onclick = () => { $('#party').classList.remove('on'); home(); };
  $('#resetBtn').onclick = () => { if (!confirm('Restart from the beginning? Progress will be cleared.')) return; S.pts = 0; S.lit.clear(); $('#ptCount').textContent = 0; home(); };
  refreshHub();
}

function rideLoader(mount, N, c, onDone) {
  let waiting = N, cars = [];
  const line = h('div', { class: 'queue' }), track = h('div', { class: 'cars' }), msg = h('div', { class: 'matmsg' });
  const btn = h('button', { type: 'button', class: 'mbtn', onclick: () => load() }, 'Load a car');
  mount.append(panel(`${N} riders, ${c} seats in each car`, 'Press the button to fill the next car. Every rider must get a ride!', h('div', { class: 'qhead' }, h('b', {}, 'Waiting:'), line), btn, track, msg));
  function draw() {
    line.innerHTML = ''; for (let i = 0; i < waiting; i++) line.append(h('i', { class: 'rider' }));
    track.innerHTML = ''; cars.forEach((n, k) => { const car = h('div', { class: 'rcar' + (n < c ? ' part' : '') }, h('small', {}, 'Car ' + (k + 1))); const s = h('div', { class: 'seats' }); for (let j = 0; j < c; j++) s.append(h('i', { class: j < n ? 'rider' : 'empty' })); car.append(s); track.append(car); });
  }
  function load() {
    if (!waiting) return; const n = Math.min(c, waiting); waiting -= n; cars.push(n); draw();
    if (n < c) { say('zippy', `Only ${n} rider${n > 1 ? 's' : ''} left… should they stay behind? Hee hee!`); }
    if (!waiting) { btn.disabled = true; msg.className = 'matmsg ok'; msg.textContent = `${N} ÷ ${c} = ${Math.floor(N / c)} R ${N % c}. ${N % c ? 'The leftover riders still need a car, so we round up!' : 'Every car is full.'}`; onDone(); }
  }
  draw();
  return () => { while (waiting) load(); };
}
function mLoader(work, done) {
  const box = h('div'); work.append(box);
  window.__solve = rideLoader(box, 27, 4, () => seq(box, [
    { type: 'fill', prompt: 'How many cars did the Ferris wheel need?', text: '[] cars', answers: ['7'], hint: 'Count every car, including the one that is not full.', explain: '27 ÷ 4 = 6 R 3. The 3 leftover riders need a 7th car.' },
    { type: 'mcq', prompt: 'Which booth was that?', options: ['Round Up: the leftovers still need a place', 'Drop It: ignore the leftovers', 'The remainder is the answer', 'Share the leftovers'], answer: 0, keepOrder: true },
  ], done));
}
const BOOTHS = ['Drop It', 'Round Up', 'Remainder is the answer', 'Share it'];

  names: { rosa: 'Ringmaster Rosa', zippy: 'Zippy', marbles: 'Madame Marbles' },
  doneWord: 'Ride complete!',
  finale: { button: 'Back to the midway', lastLine: 'All 8 gondolas lit. Showtime!', msg: (n) => 'You solved every leftover at the carnival and won ' + n + ' tickets. The show goes on!' },
  missions: [
    { title: 'Ticket Booth', sub: 'Remainder warm-up', cast: ['marbles', 'zippy'], lines: [['marbles', 'I see… remainders in your future. Let us warm up.'], ['zippy', 'Remainders? I just write R and go home!']],
      build: (w, d) => seq(w, [
        { type: 'fill', prompt: 'Divide.', text: '23 ÷ 5 = [] R []\n40 ÷ 6 = [] R []', answers: ['4', '3', '6', '4'] },
        { type: 'mcq', prompt: 'Which is a possible remainder when you divide by **7**?', options: ['6', '7', '8', '10'], answer: 0, keepOrder: true },
        { type: 'fill', prompt: 'Check it.', text: '9 × 4 + 2 = []', answers: ['38'], explain: 'So 38 ÷ 4 = 9 R 2.' },
      ], d) },
    { title: 'The Ride Loader', sub: 'Every rider needs a seat', cast: ['rosa', 'zippy'], lines: [['rosa', 'Welcome to the carnival! In real life, a remainder is never just "R something". We must decide what it means.'], ['rosa', 'Load the Ferris wheel and see what happens to the leftover riders.']], build: mLoader },
    { title: 'Booth 1: Drop It', sub: 'Only full groups count', cast: ['marbles', 'zippy'], lines: [['marbles', 'Booth 1: when the question asks for FULL groups, the leftovers do not make a group. Drop them.'], ['zippy', 'So I ignore them? My favourite!']],
      build: (w, d) => seq(w, [
        { type: 'fill', prompt: 'There are **45** popcorn scoops. Each bag needs **6** scoops. How many **full** bags can be made?', text: '[] full bags', answers: ['7'], explain: '45 ÷ 6 = 7 R 3. The 3 scoops cannot make a full bag.' },
        { type: 'fill', prompt: 'A ride ticket costs **$4**. You have **$30**. How many tickets can you buy?', text: '[] tickets', answers: ['7'], explain: '30 ÷ 4 = 7 R 2. $2 is not enough for another ticket.' },
        { type: 'mcq', prompt: 'Why do we drop the remainder in these stories?', options: ['The leftovers are not enough to make another full group', 'Remainders are always wrong', 'The question asks how many are left', 'We always drop remainders'], answer: 0 },
      ], d) },
    { title: 'Booth 2: Round Up', sub: 'Leftovers still need a place', cast: ['rosa', 'zippy'], lines: [['rosa', 'Booth 2: when everyone or everything must fit, the leftovers need one more group. Round up!'], ['zippy', 'Leave 3 kids in the queue? Ooops, no.']],
      build: (w, d) => seq(w, [
        { type: 'fill', prompt: '**58** children ride the bumper cars, **8** per round. How many rounds are needed so everyone rides?', text: '[] rounds', answers: ['8'], explain: '58 ÷ 8 = 7 R 2. The 2 children need an 8th round.' },
        { type: 'fill', prompt: 'A table seats **6**. **125** guests come to the carnival dinner. How many tables?', text: '[] tables', answers: ['21'], explain: '125 ÷ 6 = 20 R 5. The 5 guests need a 21st table.' },
        { type: 'mcq', prompt: 'Which story needs you to **round up**?', options: ['Boxes needed to pack all 50 prizes, 8 per box', 'Full boxes of 8 from 50 prizes', 'Prizes left after filling boxes of 8', 'Prizes each of 8 friends get'], answer: 0 },
      ], d) },
    { title: 'Booth 3: The Remainder Is the Answer', sub: 'How many are left?', cast: ['marbles', 'rosa'], lines: [['marbles', 'Booth 3: sometimes the question asks what is LEFT OVER. Then the remainder IS the answer.'], ['rosa', 'Read the question carefully: "left", "extra", "remaining".']],
      build: (w, d) => seq(w, [
        { type: 'fill', prompt: '**50** balloons are tied in bunches of **8**. How many balloons are **left over**?', text: '[] balloons', answers: ['2'], explain: '50 ÷ 8 = 6 R 2.' },
        { type: 'fill', prompt: '**75** stickers are shared equally by **7** clowns. How many stickers are **left** for the ringmaster?', text: '[] stickers', answers: ['5'], explain: '75 ÷ 7 = 10 R 5.' },
        { type: 'multi', prompt: 'Which questions want the **remainder** as the answer? Tick all.', options: ['How many are left over?', 'How many are extra?', 'How many full bags?', 'How many cars are needed?', 'How many remain?'], answer: [0, 1, 4] },
      ], d) },
    { title: 'Booth 4: Share It', sub: 'Split the leftovers', cast: ['rosa', 'marbles'], lines: [['rosa', 'Booth 4: if the leftovers can be cut, like pies or ribbon, share them too!'], ['marbles', '7 pies for 2 friends: 3 each, and the last pie is cut in half.']],
      build: (w, d) => seq(w, [
        { type: 'fill', prompt: '**7** pies are shared by **2** friends. How much pie does each get? (Write 3 1/2 for three and a half.)', text: '[] pies each', answers: [['3 1/2', '3½', '3.5']], explain: '7 ÷ 2 = 3 R 1, and the last pie is split into halves.' },
        { type: 'fill', prompt: '**9** pizzas are shared by **4** friends.', text: '[] pizzas each', answers: [['2 1/4', '2¼', '2.25']], explain: '9 ÷ 4 = 2 R 1; the last pizza is cut into quarters.' },
        { type: 'mcq', prompt: 'Which leftovers can be **shared**?', options: ['Ribbon, pies, pizza', 'People, cars, tickets', 'Balloons and bikes', 'None of them'], answer: 0 },
      ], d) },
    { title: 'Booth Sort & Zippy', sub: 'Pick the right booth', cast: ['zippy', 'marbles'], lines: [['zippy', 'I wrote "R 3" for every answer! That is fine, right?'], ['marbles', 'Let us sort each story into its booth.']],
      build: (w, d) => seq(w, [
        { type: 'sort', prompt: 'Sort each story into its booth.', bins: BOOTHS, items: [
          { label: 'Full packs of 6 juice boxes', bin: 0 }, { label: 'Vans needed for 30 kids, 8 per van', bin: 1 }, { label: 'Cookies left after filling bags of 5', bin: 2 }, { label: 'Metres of ribbon each for 3 kids from 10 m', bin: 3 },
          { label: 'Shelves needed for 41 books, 10 per shelf', bin: 1 }, { label: '$5 rides you can buy with $23', bin: 0 }, { label: 'Pies each when 5 are shared by 2', bin: 3 }, { label: 'Pencils left after sharing 29 by 4', bin: 2 }],
          hint: 'Ask: must everyone fit? Only full groups? What is left? Can it be cut?' },
        { type: 'mcq', prompt: 'Zippy answered "**30 kids, 8 per van: 3 R 6 vans**". What should he say?', options: ['4 vans, because the 6 kids still need a van', '3 vans', '6 vans', '3 R 6 vans is fine'], answer: 0 },
      ], d) },
    { title: 'Grand Finale', sub: 'Show what you can do', cast: ['rosa', 'marbles'], lines: [['rosa', 'The grand finale! Decide what every leftover means.'], ['marbles', 'No help from Zippy this time.']],
      build: (w, d) => seq(w, [
        { type: 'fill', prompt: '**100** people wait for a boat ride. Each boat holds **9**. How many boats are needed?', text: '[] boats', answers: ['12'], explain: '100 ÷ 9 = 11 R 1. Round up.' },
        { type: 'fill', prompt: 'Candy apples cost **$3**. Mia has **$20**. How many can she buy, and how much money is left?', text: '[] apples, $[] left', answers: ['6', '2'] },
        { type: 'fill', prompt: '**11** metres of ribbon are cut equally for **4** prize bows.', text: '[] metres each', answers: [['2 3/4', '2¾', '2.75']] },
        { type: 'mcq', prompt: 'What must you do **after** dividing a story problem?', options: ['Decide what the remainder means in the story', 'Always round up', 'Always drop the remainder', 'Always write R'], answer: 0 },
      ], d) },
  ],
};

bootActivity();
