<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission 18: Area Architect — Blueprint Blackout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#00A7B2;--teal-2:#00928e;--teal-3:#42bcb8;--teal-tint:#E2F6F7;
  --sun:#FAA71C;--sun-tint:#FFF3DA;--ember:#D77F28;--crimson:#C92426;--crimson-tint:#FBE6E6;
  --off:#E4EAEB;--off-line:#b9c6c8;--ink:#141414;--muted:#46585a;--line:#c9e9eb;--white:#fff;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--body:'Lexend','Segoe UI',system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--white)}
body{margin:0;min-height:100%;background:var(--white);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
p{margin:0 0 .6em}

.top{background:var(--teal);color:var(--white);padding:12px clamp(14px,3vw,30px);display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top h1{font-size:clamp(21px,3vw,28px);font-weight:800}
.top .sub{font-size:13.5px;opacity:.95}
.power{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.power .track{width:150px;height:14px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.power .fill{height:100%;width:0;background:var(--sun);transition:width .6s ease}
.clock{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.clock .time{font-family:var(--display);font-size:22px;font-weight:800;background:var(--white);color:var(--teal-2);padding:1px 12px;border-radius:10px;min-width:86px;text-align:center}
.clock button{border:2px solid var(--white);background:transparent;color:var(--white);border-radius:10px;padding:4px 10px;font-weight:600;font-size:14px}

.rail{display:flex;gap:8px;overflow-x:auto;padding:10px clamp(14px,3vw,30px);border-bottom:2px solid var(--teal-tint);background:var(--white);position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,66px));z-index:15}
.rail button{flex:0 0 auto;border:2px solid var(--line);background:var(--white);border-radius:14px;padding:5px 11px;text-align:left;font-size:13.5px;line-height:1.25}
.rail button small{display:block;color:var(--muted);font-size:11.5px}
.rail button.done{border-color:var(--sun)}
.rail button.done::after{content:" ✓";color:var(--ember);font-weight:700}
.rail button[aria-current="step"]{background:var(--teal);border-color:var(--teal);color:var(--white)}
.rail button[aria-current="step"] small{color:var(--white)}
.rail button.now:not([aria-current="step"]){box-shadow:inset 0 -4px 0 var(--sun)}

main{max-width:1060px;margin:0 auto;padding:24px clamp(14px,3vw,30px) 70px}
.stage{display:none}.stage.active{display:block}
.head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:14px}
.head h2{font-size:clamp(28px,4.4vw,44px);font-weight:800;color:var(--teal-2);letter-spacing:-.02em}
.head .when{background:var(--sun-tint);color:var(--ember);font-weight:600;border-radius:999px;padding:3px 12px;font-size:13.5px}

/* story */
.say{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;margin:10px 0;max-width:820px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:var(--white)}
.av.r{background:var(--teal-2)} .av.a{background:var(--sun);color:var(--ink)} .av.k{background:var(--ember)}
.bub{background:var(--teal-tint);border-radius:4px 18px 18px 18px;padding:10px 16px}
.bub .who{display:block;font-size:13px;font-weight:700;color:var(--teal-2);margin-bottom:2px}
.say.aria .bub{background:var(--sun-tint)} .say.aria .bub .who{color:var(--ember)}
.say.kai .bub{background:#fbeee2} .say.kai .bub .who{color:var(--ember)}
.guide{border-left:6px solid var(--teal);background:var(--white);border:2px solid var(--teal-tint);border-left-width:6px;border-left-color:var(--teal);padding:10px 14px;border-radius:0 14px 14px 0;margin:14px 0;max-width:820px;font-size:15.5px}
.guide b{color:var(--teal-2)}

.box{border:2px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;background:var(--white)}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:600;background:var(--teal);color:var(--white)}
.btn.alt{background:var(--sun);color:var(--ink)} .btn.ghost{background:var(--white);color:var(--teal-2);border:2px solid var(--teal)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input.n{width:84px;padding:7px 8px;border:2px solid var(--line);border-radius:10px;font-size:18px;text-align:center;background:var(--white)}
input.n.bad{border-color:var(--crimson);animation:shake .3s}
input.n.ok{border-color:var(--teal);background:var(--teal-tint)}
textarea{width:100%;padding:10px;border:2px solid var(--line);border-radius:10px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{min-height:1.5em;font-weight:600;margin-top:6px}.fb.good{color:var(--teal-2)}.fb.bad{color:var(--crimson)}
.complete{display:none;margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--sun-tint);font-weight:600}
.complete.show{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.hide{display:none!important}
.pop{animation:pop .35s ease-out both}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.choice{border:2px solid var(--line);background:var(--white);border-radius:12px;padding:8px 14px;font-weight:600}
.choice.picked{border-color:var(--teal);background:var(--teal-tint)}
.choice.wrong{border-color:var(--crimson);background:var(--crimson-tint)}

/* panels (mission 1) */
.panels{display:flex;gap:8px;margin:8px 0}
.pnl{width:46px;height:62px;border-radius:6px;background:var(--off);border:2px dashed var(--off-line);transition:all .4s}
.pnl.on{border:2px solid var(--teal-2);background:repeating-linear-gradient(0deg,rgba(255,255,255,.35) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px 10px),var(--teal)}
.qrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1.5px dashed var(--line)}
.qrow .k{width:28px;height:28px;border-radius:8px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}

/* seats (mission 2) */
.seats{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;max-width:520px;padding:10px;background:var(--white);border:2px solid var(--line);border-radius:14px}
.seat{aspect-ratio:1;border-radius:50% 50% 30% 30%;background:var(--off);transition:background .3s}
.seat.c{background:var(--crimson)}
.seat.tt{background:var(--teal)}.seat.to{background:var(--teal-3)}.seat.ot{background:var(--sun)}.seat.oo{background:var(--ember)}
.seats.cutc .seat:nth-child(14n+10){margin-right:8px}
.seats.cutc .seat:nth-child(n+141):nth-child(-n+154){margin-top:8px}

/* array (mission 3) */
.arr{display:inline-grid;grid-template-columns:repeat(7,34px);grid-auto-rows:34px;gap:8px;padding:12px;transition:gap .5s, padding .5s;position:relative}
.arr i{display:block;border-radius:50%;background:var(--teal);transition:all .5s;margin:6px}
.arr.sq i{border-radius:3px;margin:0;background:var(--teal-3);outline:1.5px solid var(--white)}
.arr.solid{gap:0}
.arr.solid i{outline-color:transparent;background:var(--teal)}
.dimwrap{display:inline-grid;grid-template-columns:auto auto;gap:6px;align-items:center}
.dimlab{font-family:var(--display);font-weight:800;color:var(--ember);font-size:22px;text-align:center}

/* blueprint builder */
.bp{border:2px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.bp-title{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:10px}
.bp-title h3{font-size:24px;font-weight:800}
.bp-title .nm{color:var(--muted);font-weight:600}
.step{padding:8px 0}
.rect{display:grid;max-width:640px;margin:10px 0;gap:4px}
.rect .tl,.rect .sl{font-family:var(--display);font-weight:800;color:var(--ember);display:flex;align-items:center;justify-content:center;font-size:20px}
.reg{border-radius:10px;background:var(--off);border:2px dashed var(--off-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;min-height:76px;transition:background .45s,border-color .45s,color .45s;text-align:center}
.reg .lab{font-weight:600;font-size:14.5px;color:var(--muted)}
.reg .val{font-family:var(--display);font-weight:800;font-size:24px}
.reg.lit{border-style:solid;color:var(--white)}
.reg.lit .lab{color:inherit}
.reg.tt.lit{background:var(--teal);border-color:var(--teal-2)}
.reg.to.lit{background:var(--teal-3);border-color:var(--teal-2)}
.reg.ot.lit{background:var(--sun);border-color:var(--ember);color:var(--ink)}
.reg.oo.lit{background:var(--ember);border-color:var(--ember)}
.reg.tap{cursor:pointer}
.reg.found{outline:4px solid var(--crimson);outline-offset:2px}
.key{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted)}
.key span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}

.badge{display:none;text-align:center;padding:28px;border-radius:24px;background:var(--sun-tint);border:3px solid var(--sun);margin-top:16px}
.badge.show{display:block;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.medal{width:150px;height:150px;margin:0 auto 12px;border-radius:24px;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:2fr 1fr;gap:5px;padding:12px;background:var(--white);border:6px solid var(--sun)}
.medal i{border-radius:6px}.medal i:nth-child(1){background:var(--teal)}.medal i:nth-child(2){background:var(--sun)}.medal i:nth-child(3){background:var(--teal-3)}.medal i:nth-child(4){background:var(--ember)}
.small{font-size:14px;color:var(--muted)}
@media (max-width:620px){.qrow{grid-template-columns:30px 1fr}.qrow>div:last-child{grid-column:2}.reg .val{font-size:19px}input.n{width:70px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top">
  <div><h1>Mission 18: Area Architect</h1><div class="sub">Blueprint Blackout · MML Multiplication Engineering Lab</div></div>
  <div class="power" aria-live="polite"><span>Vault power</span><span class="track"><span class="fill" id="pwr"></span></span><span id="pwrTxt">0%</span></div>
  <div class="clock"><span class="time" id="clock">00:00</span><button id="clkGo">Start</button><button id="clkReset">Reset</button></div>
</header>
<nav class="rail" id="rail" aria-label="Missions"></nav>
<main id="main"></main>

<script>
(function(){
const $=s=>document.querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const fmtN=n=>n.toLocaleString('en-US');
const num=v=>{const t=String(v).replace(/,/g,'').trim();return t===''?NaN:Number(t);};
const setTop=()=>document.documentElement.style.setProperty('--topH',$('#top').offsetHeight+'px');
addEventListener('resize',setTop);setTop();

/* ---------- missions & navigation ---------- */
const M=[['Power Up the Lab','0–5',0],['The Auditorium Problem','5–10',5],['Dots Become Squares','10–14',10],['The Master Blueprint','14–18',14],['Restore the Archive','18–36',18],["Kai's Blueprint",'36–42',36],['Missing Region Rescue','42–47',42],['Client Meeting','47–50',47]];
const main=$('#main'),rail=$('#rail'),stages=[],done=new Set();
M.forEach((m,i)=>{
  const b=el('button',null,m[0]+'<small>'+m[1]+' min</small>');b.onclick=()=>go(i);rail.appendChild(b);
  const s=el('section','stage');s.innerHTML='<div class="head"><h2>'+(i+1)+'. '+m[0]+'</h2><span class="when">'+m[1]+' min</span></div><div class="body"></div><div class="complete"><span class="msg"></span>'+(i<M.length-1?'<button class="btn">Next mission</button>':'')+'</div>';
  const nb=s.querySelector('.complete .btn');if(nb)nb.onclick=()=>go(i+1);
  main.appendChild(s);stages.push(s);
});
function go(i){stages.forEach((s,j)=>s.classList.toggle('active',j===i));Array.from(rail.children).forEach((b,j)=>{if(j===i)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});rail.children[i].scrollIntoView({block:'nearest',inline:'center'});scrollTo(0,0);}
function finish(i,msg){if(!done.has(i)){done.add(i);rail.children[i].classList.add('done');const p=Math.round(done.size/M.length*100);$('#pwr').style.width=p+'%';$('#pwrTxt').textContent=p+'%';}
  const c=stages[i].querySelector('.complete');c.querySelector('.msg').textContent=msg;c.classList.add('show');}
const body=i=>stages[i].querySelector('.body');
const say=(who,text)=>{const map={r:['r','Chief Engineer Rhea','R',''],a:['a','ARIA · blueprint AI','A',' aria'],k:['k','Kai · junior drafter','K',' kai']}[who];return '<div class="say'+map[3]+'"><div class="av '+map[0]+'">'+map[2]+'</div><div class="bub"><span class="who">'+map[1]+'</span>'+text+'</div></div>';};
const guide=(t,h)=>'<div class="guide"><b>'+t+':</b> '+h+'</div>';

/* clock */
let sec=0,clk=null;const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
$('#clkGo').onclick=()=>{if(clk){clearInterval(clk);clk=null;$('#clkGo').textContent='Start';return;}clk=setInterval(()=>{sec++;$('#clock').textContent=fmt(sec);let cur=0;M.forEach((m,i)=>{if(sec/60>=m[2])cur=i;});Array.from(rail.children).forEach((b,j)=>b.classList.toggle('now',j===cur));if(sec>=3000){clearInterval(clk);clk=null;}},1000);$('#clkGo').textContent='Pause';};
$('#clkReset').onclick=()=>{clearInterval(clk);clk=null;sec=0;$('#clock').textContent='00:00';$('#clkGo').textContent='Start';};

/* ---------- blueprint builder ---------- */
function Blueprint(host,cfg){
  const a=cfg.a,b=cfg.b,at=a-a%10,ao=a%10,bt=b-b%10,bo=b%10;
  const regs=[{k:'tt',x:at,y:bt},{k:'ot',x:ao,y:bt},{k:'to',x:at,y:bo},{k:'oo',x:ao,y:bo}];
  const total=a*b;let lo=null,hi=null;
  const w=el('div','bp');
  w.innerHTML='<div class="bp-title"><h3>'+a+' × '+b+'</h3>'+(cfg.name?'<span class="nm">'+cfg.name+'</span>':'')+'</div>'+
   (cfg.estimate?'<div class="step s-est">Estimate first. The product is between <input class="n lo" inputmode="numeric" aria-label="Low estimate"> and <input class="n hi" inputmode="numeric" aria-label="High estimate"> <button class="btn ghost estB">Lock estimate</button><div class="fb"></div></div>':'')+
   (cfg.choice?'<div class="step s-choice"></div>':
   '<div class="step s-split'+(cfg.estimate?' hide':'')+'"><p>Split each factor by place value.</p><div class="row">Across the top: '+a+' = <input class="n t1" inputmode="numeric" aria-label="Tens of '+a+'"> + <input class="n t2" inputmode="numeric" aria-label="Ones of '+a+'"></div><div class="row" style="margin-top:8px">Down the side: '+b+' = <input class="n d1" inputmode="numeric" aria-label="Tens of '+b+'"> + <input class="n d2" inputmode="numeric" aria-label="Ones of '+b+'"></div><div class="row" style="margin-top:8px"><button class="btn splitB">Check my split</button></div><div class="fb"></div></div>')+
   (cfg.predict?'<div class="step s-pred hide"><p>Predict: how many regions will this blueprint have?</p><div class="row"><input class="n pr" inputmode="numeric" aria-label="Number of regions"><button class="btn prB">Lock prediction</button></div><div class="fb"></div></div>':'')+
   '<div class="s-rect hide"><div class="rect"></div><div class="key"><span style="--c:var(--teal)">tens × tens</span><span style="--c:var(--teal-3)">tens × ones</span><span style="--c:var(--sun)">ones × tens</span><span style="--c:var(--ember)">ones × ones</span></div><div class="row" style="margin-top:10px"><button class="btn regB">Check regions</button></div><div class="fb rf"></div></div>'+
   '<div class="step s-tot hide"><div class="row">Total: <span class="sumtxt"></span> = <input class="n tot" inputmode="numeric" style="width:110px" aria-label="Total"><button class="btn alt totB">Restore blueprint</button></div><div class="fb"></div></div>';
  host.appendChild(w);
  const q=s=>w.querySelector(s);
  function showRect(){
    q('.s-rect').classList.remove('hide');
    const r=q('.rect'),cw1=at,cw2=Math.max(ao,at*.28),rh1=bt,rh2=Math.max(bo,bt*.32),H=Math.min(300,Math.max(190,b*5));
    r.style.gridTemplateColumns='46px '+cw1+'fr '+cw2+'fr';r.style.gridTemplateRows='34px '+(H*rh1/(rh1+rh2))+'px '+(H*rh2/(rh1+rh2))+'px';
    r.innerHTML='<span></span><span class="tl">'+at+'</span><span class="tl">'+ao+'</span>';
    regs.forEach((g,i)=>{
      if(i===0)r.insertAdjacentHTML('beforeend','<span class="sl">'+bt+'</span>');
      if(i===2)r.insertAdjacentHTML('beforeend','<span class="sl">'+bo+'</span>');
      const lab=g.x+' × '+g.y;
      const d=el('div','reg '+g.k,'<span class="lab">'+(cfg.labels===false?'? × ?':lab)+'</span><input class="n" inputmode="numeric" aria-label="Area of region '+(i+1)+'">');
      d.dataset.i=i;g.el=d;r.appendChild(d);
    });
    (cfg.prefill||[]).forEach(i=>light(i));
    if(cfg.prefillNote)q('.rf').innerHTML='<span style="color:var(--teal-2)">'+cfg.prefillNote+'</span>';
    const first=regs.find(g=>!g.lit);if(first)first.el.querySelector('input').focus();
  }
  function light(i){const g=regs[i];g.lit=true;g.el.classList.add('lit','pop');g.el.innerHTML='<span class="lab">'+g.x+' × '+g.y+'</span><span class="val">'+fmtN(g.x*g.y)+'</span>';}
  function checkRegs(){let all=true,miss=0;regs.forEach((g,i)=>{if(g.lit)return;const inp=g.el.querySelector('input');const v=num(inp.value);
      if(v===g.x*g.y)light(i);else{all=false;miss++;inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');}});
    const f=q('.rf');
    if(all){f.className='fb good rf';f.textContent='All four regions are powered.';q('.regB').disabled=true;q('.s-tot').classList.remove('hide');q('.sumtxt').textContent=regs.map(g=>fmtN(g.x*g.y)).join(' + ');q('.tot').focus();}
    else{f.className='fb bad rf';f.textContent=miss+' region'+(miss>1?'s are':' is')+' still dark. '+(cfg.labels===false?'Multiply the label on its column by the label on its row.':'Tens × tens makes hundreds; check the place value.');}
  }
  q('.regB').onclick=checkRegs;
  w.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const c=e.target.closest('.reg,.s-tot,.s-split,.s-est,.s-pred');if(!c)return;const btn=c.classList.contains('reg')?q('.regB'):c.querySelector('.btn');if(btn&&!btn.disabled)btn.click();});
  q('.totB').onclick=()=>{const v=num(q('.tot').value),f=q('.s-tot .fb');
    if(v===total){q('.tot').classList.add('ok');q('.totB').disabled=true;f.className='fb good';
      let m=fmtN(a)+' × '+fmtN(b)+' = '+fmtN(total)+'. Blueprint restored!';
      if(lo!==null)m+=(total>=lo&&total<=hi)?' It is inside your estimate of '+fmtN(lo)+' to '+fmtN(hi)+'.':' It is outside your estimate ('+fmtN(lo)+' to '+fmtN(hi)+'), so think about why for next time.';
      f.textContent=m;w.querySelector('.rect').style.boxShadow='0 0 0 4px var(--sun-tint)';cfg.onDone&&cfg.onDone();}
    else{f.className='fb bad';f.textContent='Not yet. Add the four region values again, carefully.';}};
  if(cfg.estimate)q('.estB').onclick=()=>{const L=num(q('.lo').value),Hh=num(q('.hi').value),f=q('.s-est .fb');
    if(isNaN(L)||isNaN(Hh)||L>=Hh){f.className='fb bad';f.textContent='Type a low number and a higher number.';return;}
    lo=L;hi=Hh;f.className='fb good';f.textContent='Estimate locked. Tip: the tens × tens region ('+at+' × '+bt+' = '+fmtN(at*bt)+') is the biggest part.';q('.estB').disabled=true;q('.s-split').classList.remove('hide');};
  if(!cfg.choice){
    if(cfg.prefillSplit){q('.t1').value=at;q('.t2').value=ao;q('.d1').value=bt;q('.d2').value=bo;}

    '<div class="row">Product: <input class="n pp" inputmode="numeric" style="width:110px" aria-label="Product"><button class="btn alt">Rebuild</button></div><div class="fb"></div>';
    d.querySelector('.btn').onclick=()=>{const g=c=>num(d.querySelector(c).value),c1=g('.c1'),c2=g('.c2'),r1=g('.r1'),r2=g('.r2'),p=g('.pp'),f=d.querySelector('.fb');
      const ok=r1*c1===v[0]&&r1*c2===v[1]&&r2*c1===v[2]&&r2*c2===v[3]&&c2<10&&r2<10&&c1%10===0&&r1%10===0;const prod=(c1+c2)*(r1+r2);
      if(ok&&p===prod){f.className='fb good';f.textContent='Rebuilt: ('+r1+' + '+r2+') × ('+c1+' + '+c2+') = '+(r1+r2)+' × '+(c1+c2)+' = '+fmtN(prod)+'.';d.querySelector('.btn').disabled=true;solved++;if(solved===3){host.appendChild(own);}}
      else if(ok){f.className='fb bad';f.textContent='Dimensions are right! Now add the four regions for the product.';}
      else{f.className='fb bad';f.textContent='Check: side tens × top tens must make '+fmtN(v[0])+', and side ones × top ones must make '+v[3]+'.';}};
    host.appendChild(d);});
  const own=el('div','box','<p><b>Round 4: your turn to challenge your teacher.</b> Choose two 2-digit numbers (no zeros in the ones). Your teacher must find them from the regions alone.</p><div class="row"><input class="n" id="o1" inputmode="numeric" aria-label="First number"> × <input class="n" id="o2" inputmode="numeric" aria-label="Second number"><button class="btn" id="ob">Make the regions</button></div><div class="fb" id="of"></div><div id="ov"></div>');
  own.querySelector('#ob').onclick=()=>{const x=num(own.querySelector('#o1').value),y=num(own.querySelector('#o2').value),f=own.querySelector('#of');
    if(!(x>=11&&x<=99&&y>=11&&y<=99&&x%10&&y%10)){f.className='fb bad';f.textContent='Use two 2-digit numbers with no zero in the ones place.';return;}
    const xt=x-x%10,xo=x%10,yt=y-y%10,yo=y%10;f.className='fb good';f.textContent='Show these regions to your teacher. Hide your numbers!';own.querySelector('#o1').type='password';own.querySelector('#o2').type='password';
    own.querySelector('#ov').innerHTML='<div class="rect" style="grid-template-columns:3fr 1.3fr;grid-template-rows:100px 70px;max-width:420px"><div class="reg tt lit"><span class="val">'+fmtN(xt*yt)+'</span></div><div class="reg ot lit"><span class="val">'+fmtN(xo*yt)+'</span></div><div class="reg to lit"><span class="val">'+fmtN(xt*yo)+'</span></div><div class="reg oo lit"><span class="val">'+(xo*yo)+'</span></div></div><button class="btn ghost" id="rv">Reveal my numbers</button>';
    own.querySelector('#rv').onclick=()=>{own.querySelector('#rv').outerHTML='<p class="fb good">Your blueprint: '+x+' × '+y+' = '+fmtN(x*y)+'. Did your teacher get it right?</p>';finish(6,'ARIA: Missing Region Rescue complete. You can build area models forwards AND backwards.');};};
})();

/* ================= MISSION 8 ================= */
(function(){const b=body(7);
  b.innerHTML=say('r','The client meeting starts in three minutes. Show them what an Area Architect can do: three questions, on your own.')+
  '<p style="margin-top:14px"><b>1. Build and power the blueprint.</b></p><div id="x1"></div>'+
  '<div class="box"><p><b>2.</b> In the blueprint for <b>56 × 23</b>, what does the region <b>6 × 20</b> represent?</p><div class="row" style="flex-direction:column;align-items:flex-start"><button class="choice" data-x="0">the tens of 56 × the ones of 23</button><button class="choice" data-x="1">the ones of 56 × the tens of 23</button><button class="choice" data-x="2">6 × 2 = 12</button></div><div class="row" style="margin-top:8px">Its area is <input class="n" id="x2" inputmode="numeric" aria-label="Area of 6 by 20"></div><div class="fb" id="x2f"></div></div>'+
  '<div class="box"><p><b>3.</b> Explain why a 2-digit × 2-digit blueprint always has four regions.</p><textarea id="x3" rows="3" aria-label="Your explanation"></textarea><p class="small" style="margin-top:6px">Check your explanation. Did you:</p><label><input type="checkbox" class="xc"> say each factor splits into tens and ones (2 parts each)?</label><br><label><input type="checkbox" class="xc"> say every part of one factor meets every part of the other?</label><br><label><input type="checkbox" class="xc"> mention 2 × 2 = 4?</label></div>'+
  '<div class="row"><button class="btn alt" id="xb">Finish the client meeting</button></div><div class="fb" id="xf"></div>'+
  '<div class="badge" id="badge"><div class="medal"><i></i><i></i><i></i><i></i></div><h3 style="font-size:32px;color:var(--teal-2)">Area Architect badge unlocked</h3><p style="font-size:18px;margin-top:8px">The vault is fully restored. You can see any multiplication as a rectangle split by place value.</p>'+say('r','You restored every blueprint by seeing each region as one piece of the product. Next mission, the Partial Product Factory, you\'ll write those same regions as an equation.')+'</div>';
  let q1=false,pick=null;
  Blueprint(b.querySelector('#x1'),{a:32,b:14,name:'Client blueprint',labels:false,onDone:()=>{q1=true;}});
  b.querySelectorAll('[data-x]').forEach(c=>c.onclick=()=>{b.querySelectorAll('[data-x]').forEach(x=>x.classList.remove('picked'));c.classList.add('picked');pick=c.dataset.x;});
  b.querySelector('#xb').onclick=()=>{const f=b.querySelector('#xf'),f2=b.querySelector('#x2f'),msg=[];
    if(!q1)msg.push('Question 1: restore the 32 × 14 blueprint.');
    const q2=pick==='1'&&num(b.querySelector('#x2').value)===120;
    if(!q2){f2.className='fb bad';f2.textContent='The 6 is the ones digit of 56; the 20 is the tens of 23. 6 × 2 tens = 12 tens.';msg.push('Question 2 needs another look.');}else{f2.className='fb good';f2.textContent='Ones of 56 × tens of 23 = 120.';}
    const q3=b.querySelector('#x3').value.trim().length>20&&[...b.querySelectorAll('.xc')].filter(x=>x.checked).length>=2;
    if(!q3)msg.push('Question 3: write a full explanation and tick your checks.');
    if(msg.length){f.className='fb bad';f.textContent=msg.join(' ');return;}
    f.className='fb good';f.textContent='Client meeting complete!';b.querySelector('#badge').classList.add('show');finish(7,'Mission 18 complete. Vault power 100%.');b.querySelector('#badge').scrollIntoView({behavior:'smooth',block:'center'});};
})();

go(0);
})();
</script>
